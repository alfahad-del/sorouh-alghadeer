<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة تقديم للاستثمار داخل مجمع البدور </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Cairo',sans-serif;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px 60px;background:#232323;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.72;animation:drift 14s ease-in-out infinite alternate}
.b1{width:560px;height:560px;background:radial-gradient(circle,#89764c,#e8943a);top:-140px;left:-120px;animation-delay:0s}
.b2{width:420px;height:420px;background:radial-gradient(circle,#89764c,#e8943a);top:20px;right:-100px;animation-delay:-5s}
.b3{width:500px;height:500px;background:radial-gradient(circle,#89764c,#e8943a);bottom:-120px;left:28%;animation-delay:-9s}
.b4{width:320px;height:320px;background:radial-gradient(circle,#89764c,#e8943a);bottom:40px;right:4%;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(28px,-38px) scale(1.04)}66%{transform:translate(-18px,28px) scale(.97)}100%{transform:translate(14px,-14px) scale(1.02)}}
.card{position:relative;z-index:10;width:100%;max-width:480px;background:rgba(255,255,255,.17);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1.5px solid rgba(255,255,255,.38);border-radius:32px;padding:36px 28px 32px;box-shadow:0 8px 48px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.45);animation:cardIn .8s cubic-bezier(.22,.9,.36,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.header{text-align:center;margin-bottom:26px}
.card-title{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px;margin-bottom:5px}.card-sub{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
.progress-wrap{margin-bottom:22px}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);margin-bottom:7px}
.progress-bar{height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a8d4ff,#fff);border-radius:3px;transition:width .5s ease;width:0%}
.step{display:none;flex-direction:column;gap:16px}
.step.active{display:flex;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.sec-badge{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.sec-num{width:28px;height:28px;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.45);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.sec-title{font-size:15px;font-weight:700;color:#fff}
.divider{height:1px;background:rgba(255,255,255,.18);margin:2px 0}
.field{display:flex;flex-direction:column;gap:7px}
.field-label{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.88);display:flex;align-items:center;gap:5px}
.required{color:#ffb3b3;font-size:15px}
.glass-input,.glass-textarea,.glass-select{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 16px;font-size:15px;font-family:'Cairo',sans-serif;color:#fff;outline:none;transition:background .2s,border-color .2s;width:100%}
.glass-input::placeholder,.glass-textarea::placeholder{color:rgba(255,255,255,.42)}
.glass-input:focus,.glass-textarea:focus,.glass-select:focus{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.6)}
.glass-textarea{resize:none;min-height:80px;line-height:1.6}
.edu-wrap{position:relative}
.edu-wrap::after{content:'▾';position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);font-size:13px;pointer-events:none}
.glass-select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-left:36px}
.glass-select option{color:#1a2a5e;background:#fff;font-family:'Cairo',sans-serif}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn-row{display:flex;gap:10px}
.yn-btn{flex:1;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:11px 10px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px}
.yn-btn .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.45);flex-shrink:0;transition:all .18s;display:flex;align-items:center;justify-content:center;font-size:9px}
.yn-btn.sel{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.7);color:#fff}
.yn-btn.sel .dot{background:#fff;border-color:#fff;color:#1a6fff}
.yn-row.err-group .yn-btn{border-color:rgba(255,100,100,.8)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt-btn{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:11px 12px;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;text-align:right}
.opt-btn .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex-shrink:0;transition:all .18s;display:flex;align-items:center;justify-content:center;font-size:9px}
.opt-btn.sel{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.7);color:#fff}
.opt-btn.sel .dot{background:#fff;border-color:#fff;color:#1a6fff}
.opt-grid.err-group .opt-btn{border-color:rgba(255,100,100,.8)}
.sub-section{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;overflow:hidden;max-height:0;padding:0;opacity:0;transition:max-height .4s ease,padding .3s ease,opacity .3s ease;display:flex;flex-direction:column;gap:12px}
.sub-section.open{max-height:700px;padding:16px;opacity:1}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn-back{flex:0 0 52px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;color:#fff;font-size:20px;cursor:pointer;transition:background .18s;display:flex;align-items:center;justify-content:center}
.btn-back:hover{background:rgba(255,255,255,.28)}
.btn-next{flex:1;background:#fff;border:none;border-radius:100px;padding:14px 20px;font-family:'Cairo',sans-serif;font-size:15.5px;font-weight:700;color:#1a2a5e;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 4px 20px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.2)}
.btn-next:active{transform:scale(.98)}
.success{display:none;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:10px 0}
.success.show{display:flex;animation:fadeUp .5s ease both}
.success-icon{width:72px;height:72px;background:rgba(52,199,89,.22);border:2px solid rgba(52,199,89,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.success-title{font-size:21px;font-weight:900;color:#fff}
.success-sub{font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.6;max-width:300px}
.btn-restart{background:#fff;border:none;border-radius:100px;padding:13px 32px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;color:#1a2a5e;cursor:pointer;margin-top:6px;transition:transform .18s}
.btn-restart:hover{transform:translateY(-2px)}
.glass-input.err,.glass-textarea.err,.glass-select.err{border-color:rgba(255,100,100,.8)!important}
</style>
</head>
<body>
<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="card">
  <div class="header">
    <img src="wep.png" style="width:300px;height:300px;object-fit:contain;margin-bottom:10px;" />
    <div class="card-title">استمارة طلب الاستثمار في مجمع البدور</div>
    <div class="card-sub">يرجى تعبئة جميع البيانات بدقة لنتمكن من دراسة طلبك</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="step-lbl">القسم 1 من 4</span>
      <span id="pct-lbl">25%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
  </div>
  <div id="form-body">

    <!-- STEP 1 -->
    <div class="step active" id="s1">
      <div class="sec-badge">
        <div class="sec-num">١</div>
        <div class="sec-title">المعلومات الشخصية</div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label class="field-label">الاسم الكامل <span class="required">*</span></label>
        <input class="glass-input" id="f-name" type="text" placeholder="أدخل اسمك الكامل" />
      </div>
      <div class="field">
        <label class="field-label">رقم الهاتف <span class="required">*</span></label>
        <input class="glass-input" id="f-phone" type="tel" placeholder="07XX XXX XXXX" style="direction:ltr" />
      </div>
      <div class="field">
        <label class="field-label">البريد الإلكتروني <span class="required">*</span></label>
        <input class="glass-input" id="f-email" type="email" placeholder="example@gmail.com" style="direction:ltr" />
      </div>
      <div class="field">
        <label class="field-label">المدينة / منطقة السكن <span class="required">*</span></label>
        <input class="glass-input" id="f-city" type="text" placeholder="مثال: بغداد / مجمع بدور بغداد السكني" />
      </div>
      <div class="field">
        <label class="field-label">التحصيل الدراسي <span class="required">*</span></label>
        <div class="edu-wrap">
          <select class="glass-select" id="f-edu">
            <option value="" disabled selected>اختر مستواك الدراسي</option>
            <option value="ابتدائية">ابتدائية</option>
            <option value="متوسطة">متوسطة</option>
            <option value="إعدادية">إعدادية</option>
            <option value="دبلوم">دبلوم</option>
            <option value="بكالوريوس">بكالوريوس</option>
            <option value="ماجستير">ماجستير</option>
            <option value="دكتوراه">دكتوراه</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-next" onclick="next(1)">التالي &nbsp;<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="s2">
      <div class="sec-badge">
        <div class="sec-num">٢</div>
        <div class="sec-title">معلومات المشروع المطلوب</div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label class="field-label">اسم العلامة التجارية أو المشروع <span class="required">*</span></label>
        <input class="glass-input" id="f-brand" type="text" placeholder="أدخل اسم العلامة التجارية" />
      </div>
      <div class="field">
        <label class="field-label">نوع النشاط أو المجال <span class="required">*</span></label>
        <input class="glass-input" id="f-sector" type="text" placeholder="مثال: مطعم، كافيه، خدمات، تقنية..." />
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(1)">›</button>
        <button class="btn-next" onclick="next(2)">التالي &nbsp;<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="s3">
      <div class="sec-badge">
        <div class="sec-num">٣</div>
        <div class="sec-title">الخبرات السابقة</div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label class="field-label">هل لديك خبرة سابقة في إدارة أو تشغيل المشاريع؟ <span class="required">*</span></label>
        <div class="yn-row" id="yn-exp">
          <button class="yn-btn" onclick="yn('yn-exp','yes')"><div class="dot"></div>نعم</button>
          <button class="yn-btn" onclick="yn('yn-exp','no')"><div class="dot"></div>لا</button>
        </div>
      </div>
      <div class="sub-section" id="exp-sub">
        <div class="field">
          <label class="field-label">نوع المشروع <span class="required">*</span></label>
          <input class="glass-input" id="f-prev-type" type="text" placeholder="مثال: مطعم، متجر..." />
        </div>
        <div class="two-col">
          <div class="field">
            <label class="field-label">مدة التشغيل <span class="required">*</span></label>
            <input class="glass-input" id="f-prev-dur" type="text" placeholder="مثال: سنتان" />
          </div>
          <div class="field">
            <label class="field-label">الموقع <span class="required">*</span></label>
            <input class="glass-input" id="f-prev-loc" type="text" placeholder="المدينة" />
          </div>
        </div>
        <div class="field">
          <label class="field-label">عدد الفروع <span class="required">*</span></label>
          <input class="glass-input" id="f-prev-branches" type="number" placeholder="0" style="direction:ltr" />
        </div>
        <div class="field">
          <label class="field-label">هل المشروع ما زال قائماً؟ <span class="required">*</span></label>
          <div class="yn-row" id="yn-still">
            <button class="yn-btn" onclick="yn('yn-still','yes')"><div class="dot"></div>نعم</button>
            <button class="yn-btn" onclick="yn('yn-still','no')"><div class="dot"></div>لا</button>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(2)">›</button>
        <button class="btn-next" onclick="next(3)">التالي &nbsp;<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>
    </div>

    <!-- STEP 4 -->
    <div class="step" id="s4">
      <div class="sec-badge">
        <div class="sec-num">٤</div>
        <div class="sec-title">الجاهزية المالية والتشغيلية</div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label class="field-label">هل لديك القدرة المالية للاستثمار في المشروع؟ <span class="required">*</span></label>
        <div class="yn-row" id="yn-fin">
          <button class="yn-btn" onclick="yn('yn-fin','yes')"><div class="dot"></div>نعم</button>
          <button class="yn-btn" onclick="yn('yn-fin','no')"><div class="dot"></div>لا</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">هل لديك فريق عمل أو القدرة على إدارة وتشغيل المشروع؟ <span class="required">*</span></label>
        <div class="yn-row" id="yn-team">
          <button class="yn-btn" onclick="yn('yn-team','yes')"><div class="dot"></div>نعم</button>
          <button class="yn-btn" onclick="yn('yn-team','no')"><div class="dot"></div>لا</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">ما هي مصادر التمويل المتاحة؟ <span class="required">*</span></label>
        <div class="opt-grid" id="og-fund">
          <button class="opt-btn" onclick="multi('og-fund',this)"><div class="dot"></div>تمويل شخصي</button>
          <button class="opt-btn" onclick="multi('og-fund',this)"><div class="dot"></div>شريك استثماري</button>
          <button class="opt-btn" onclick="multi('og-fund',this)"><div class="dot"></div>تمويل بنكي</button>
          <button class="opt-btn" onclick="multi('og-fund',this)" id="other-fund-btn"><div class="dot"></div>أخرى</button>
        </div>
        <input class="glass-input" id="f-fund-other" type="text" placeholder="يرجى التوضيح..." style="display:none;margin-top:8px" />
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goTo(3)">›</button>
        <button class="btn-next" onclick="submit()">إرسال الطلب </button>
      </div>
    </div>

    <!-- Success -->
    <div class="success" id="success">
      <div class="success-icon">✓</div>
      <div class="success-title">تم إرسال طلبك بنجاح!</div>
      <div class="success-sub">شكراً لاهتمامك. سيقوم فريقنا بمراجعة طلبك والتواصل معك قريباً.</div>
      <button class="btn-restart" onclick="restart()">تعبئة استمارة جديدة</button>
    </div>
  </div>
</div>

<script>
const TOTAL = 4;
let cur = 1;
const expAnswered = () => document.querySelector('#yn-exp .sel');

function updateProgress(n){
  const pct=Math.round((n/TOTAL)*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('pct-lbl').textContent=pct+'%';
  document.getElementById('step-lbl').textContent='القسم '+n+' من '+TOTAL;
}

function goTo(n){
  document.getElementById('s'+cur).classList.remove('active');
  cur=n;
  document.getElementById('s'+cur).classList.add('active');
  updateProgress(cur);
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(from){
  let ok=true;
  if(from===1){
    if(!v('f-name'))ok=false;
    if(!v('f-phone'))ok=false;
    if(!vEmail('f-email'))ok=false;
    if(!v('f-city'))ok=false;
    if(!vSelect('f-edu'))ok=false;
  }
  if(from===2){
    if(!v('f-brand'))ok=false;
    if(!v('f-sector'))ok=false;
  }
  if(from===3){
    const sel=expAnswered();
    if(!sel){shakeGroup('yn-exp');ok=false;}
    else if(sel.textContent.trim()==='نعم'){
      if(!v('f-prev-type'))ok=false;
      if(!v('f-prev-dur'))ok=false;
      if(!v('f-prev-loc'))ok=false;
      if(!vNum('f-prev-branches'))ok=false;
      const stillSel=document.querySelector('#yn-still .sel');
      if(!stillSel){shakeGroup('yn-still');ok=false;}
    }
  }
  if(ok && from<TOTAL) goTo(from+1);
}

function v(id){
  const el=document.getElementById(id);
  if(!el||!el.value.trim()){shake(el);return false;}
  return true;
}
function vNum(id){
  const el=document.getElementById(id);
  if(!el||el.value===''){shake(el);return false;}
  return true;
}
function vSelect(id){
  const el=document.getElementById(id);
  if(!el||!el.value){shake(el);return false;}
  return true;
}
function vEmail(id){
  const el=document.getElementById(id);
  if(!el||!el.value.trim()||!el.value.includes('@')){shake(el);return false;}
  return true;
}
function shake(el){
  if(!el)return;
  el.classList.add('err');
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:300,easing:'ease-out'});
  setTimeout(()=>el.classList.remove('err'),1200);
}
function shakeGroup(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.add('err-group');
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'});
  setTimeout(()=>el.classList.remove('err-group'),1200);
}

function yn(groupId,val){
  const btns=document.querySelectorAll('#'+groupId+' .yn-btn');
  btns.forEach(b=>{b.classList.remove('sel');b.querySelector('.dot').innerHTML='';});
  const idx=val==='yes'?0:1;
  btns[idx].classList.add('sel');
  btns[idx].querySelector('.dot').innerHTML='✓';
  if(groupId==='yn-exp'){
    const sub=document.getElementById('exp-sub');
    val==='yes'?sub.classList.add('open'):sub.classList.remove('open');
  }
}

function multi(groupId,btn){
  btn.classList.toggle('sel');
  btn.querySelector('.dot').innerHTML=btn.classList.contains('sel')?'✓':'';
  if(groupId==='og-fund'){
    const ob=document.getElementById('other-fund-btn');
    document.getElementById('f-fund-other').style.display=ob.classList.contains('sel')?'block':'none';
  }
}

function submit(){
  let ok=true;
  if(!document.querySelector('#yn-fin .sel')){shakeGroup('yn-fin');ok=false;}
  if(!document.querySelector('#yn-team .sel')){shakeGroup('yn-team');ok=false;}
  const fundSel=document.querySelectorAll('#og-fund .sel');
  if(fundSel.length===0){shakeGroup('og-fund');ok=false;}
  const otherBtn=document.getElementById('other-fund-btn');
  if(otherBtn.classList.contains('sel')&&!document.getElementById('f-fund-other').value.trim()){
    shake(document.getElementById('f-fund-other'));ok=false;
  }
  if(!ok)return;

  const expSel=document.querySelector('#yn-exp .sel');
  const stillSel=document.querySelector('#yn-still .sel');
  const finSel=document.querySelector('#yn-fin .sel');
  const teamSel=document.querySelector('#yn-team .sel');
  const fundingArr=[...document.querySelectorAll('#og-fund .sel')]
    .map(b=>b.textContent.trim()).join(' - ');

  const data={
    name:         document.getElementById('f-name').value,
    phone:        document.getElementById('f-phone').value,
    email:        document.getElementById('f-email').value,
    city:         document.getElementById('f-city').value,
    edu:          document.getElementById('f-edu').value,
    brand:        document.getElementById('f-brand').value,
    sector:       document.getElementById('f-sector').value,
    hasExp:       expSel?expSel.textContent.trim():'',
    prevType:     document.getElementById('f-prev-type').value,
    prevDur:      document.getElementById('f-prev-dur').value,
    prevLoc:      document.getElementById('f-prev-loc').value,
    prevBranches: document.getElementById('f-prev-branches').value,
    stillActive:  stillSel?stillSel.textContent.trim():'',
    financial:    finSel?finSel.textContent.trim():'',
    team:         teamSel?teamSel.textContent.trim():'',
    funding:      fundingArr
  };

  const SHEET_URL='https://script.google.com/macros/s/AKfycbyFu3of5SYuBAJaC8o7qWw4UI0EmvFhkwFToMOjrBK7b56aEUASLAE9VUksRoYy4GK-QQ/exec';

  const btn=document.querySelector('#s4 .btn-next');
  btn.textContent='جاري الإرسال...';
  btn.disabled=true;

  fetch(SHEET_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  })
  .then(()=>{
    document.getElementById('s4').classList.remove('active');
    document.getElementById('pfill').style.width='100%';
    document.getElementById('pct-lbl').textContent='100%';
    document.getElementById('step-lbl').textContent='مكتمل ✓';
    document.getElementById('success').classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});
  })
  .catch(()=>{
    alert('حدث خطأ، يرجى المحاولة مجدداً');
    btn.textContent='إرسال الطلب';
    btn.disabled=false;
  });
}
  if(!ok)return;
  document.getElementById('s4').classList.remove('active');
  document.getElementById('pfill').style.width='100%';
  document.getElementById('pct-lbl').textContent='100%';
  document.getElementById('step-lbl').textContent='مكتمل ✓';
  document.getElementById('success').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  document.getElementById('success').classList.remove('show');
  ['f-name','f-phone','f-email','f-city',
   'f-edu',
   'f-brand','f-sector','f-prev-type','f-prev-dur','f-prev-loc',
   'f-prev-branches','f-fund-other'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.value='';
  });
  document.querySelectorAll('.yn-btn,.opt-btn').forEach(b=>{
    b.classList.remove('sel');
    b.querySelector('.dot').innerHTML='';
  });
  document.getElementById('exp-sub').classList.remove('open');
  document.getElementById('f-fund-other').style.display='none';
  cur=1;
  updateProgress(1);
  document.getElementById('s1').classList.add('active');
}

updateProgress(1);
</script>
